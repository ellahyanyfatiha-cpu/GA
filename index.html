 const iso=String(code||"AE").toUpperCase();
 if(!/^[A-Z]{2}$/.test(iso))return "🌐";
 return String.fromCodePoint(...Array.from(iso,ch=>127397+ch.charCodeAt(0)));
}

let assiaOcrLoader;
async function assiaReadShopPhoto(file){
 // Reconnaissance multilingue : conserve l'écriture arabe et les chiffres d'origine.
 if(!assiaOcrLoader){assiaOcrLoader=new Promise((resolve,reject)=>{
  if(window.Tesseract){resolve(window.Tesseract);return;}
  const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error("Reconnaissance indisponible."));
  script.onerror=()=>reject(new Error("Connexion Internet nécessaire pour lire le texte de la photo."));
  document.head.appendChild(script);
 }).catch(err=>{assiaOcrLoader=null;throw err;});}
 const engine=await assiaOcrLoader;
 // L'agrandissement facilite la lecture des petites enseignes, sans altérer le fichier original.
 let source=file;
 try{
  const bitmap=await createImageBitmap(file);
  const factor=Math.min(3,Math.max(1,1900/Math.max(bitmap.width,bitmap.height)));
  const canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*factor);canvas.height=Math.round(bitmap.height*factor);
  const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.filter="contrast(125%)";ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();source=canvas;
 }catch(_e){source=file;}
 // Deux lectures séparées évitent que les alphabets se parasitent.
 const latin=await engine.recognize(source,"deu+fra+eng");
 const latinText=String(latin.data.text||"").replace(/\r/g,"").trim();
 const latinChoice=assiaBestShopLine(latinText,"latin");
 if(latinChoice && latinChoice.confident)return {choice:latinChoice,raw:latinText};
 const arabic=await engine.recognize(source,"ara");
 const arabicText=String(arabic.data.text||"").replace(/\r/g,"").trim();
 const arabicChoice=assiaBestShopLine(arabicText,"arabic");
 const candidates=[latinChoice,arabicChoice].filter(Boolean).sort((x,y)=>y.score-x.score);
 return {choice:candidates[0]||null,raw:[latinText,arabicText].filter(Boolean).join("\n---\n")};
}
function assiaShopLines(text){
 // Ne garder que les lettres Unicode, les chiffres et les espaces réellement reconnus.
 return String(text||"").split(/\r?\n/).map(v=>v.replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()).filter(Boolean);
}
function assiaBestShopLine(text,mode){
 const lines=assiaShopLines(text);
 const results=[];
 for(const line of lines){
  const latin=(line.match(/[A-Za-zÀ-ÖØ-öø-ÿ]/g)||[]).length;
  const arabic=(line.match(/[\u0621-\u064A\u0671-\u06D3]/g)||[]).length;
  const digits=(line.match(/[0-9\u0660-\u0669\u06F0-\u06F9]/g)||[]).length;
  const chars=Array.from(line.replace(/\s/g,"")).length;
  const words=line.split(/\s+/).length;
  const alphabet=mode==="latin"?latin:arabic;
  // Ne pas accepter une suite de caractères incohérente ou trop longue.
  if(chars<2||chars>45||words>7||alphabet===0||
     (latin>0&&arabic>0&&Math.min(latin,arabic)>1))continue;
  const score=alphabet*2+Math.min(digits,8)-Math.max(0,words-4)*4;
  results.push({line,score,confident:chars<=35&&words<=6});
 }
 return results.sort((a,b)=>b.score-a.score)[0]||null;
}

  patch(l.id,{contact:contactPrefix+JSON.stringify(updated)});
  if(updated.whatsapp && (updated.whatsapp!==c.whatsapp || updated.nom!==c.nom)){
   saveWhatsAppContact(contactPrefix+JSON.stringify(updated));

 },`<div class="contact-fields">

   ${l.image?`<div class="photo-preview-wrap"><img class="photo-preview" src="${l.image}" alt="Photo de la Abaya"><button type="button" class="danger remove-photo" aria-label="Supprimer la photo" title="Supprimer la photo"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 10v7"/><path d="M14 10v7"/></svg></button></div>`:`<div class="muted" style="margin-top:9px">Aucune photo ajoutée pour le moment.</div>`}</div>
   <div class="field"><label class="label">CONTACT :</label>
    ${hasContact(l.contact)?`<div class="contact-card">${contactSummary(l.contact)}</div><div class="contact-actions luxe-contact-actions"><button type="button" class="soft edit-contact"><span class="contact-action-icon" aria-hidden="true">✎</span><span>Modifier</span></button>${readContact(l.contact).whatsapp?`<button type="button" class="soft save-whatsapp"><span class="contact-action-icon" aria-hidden="true">♙</span><span>Enregistrer le contact</span></button>`:""}${readContact(l.contact).localisation?`<a class="soft maps-action" href="${escapeHTML(mapsLink(readContact(l.contact).localisation))}" target="_blank" rel="noopener noreferrer"><span class="contact-action-icon" aria-hidden="true">⌖</span><span>Voir sur Maps</span><span aria-hidden="true">↗</span></a>`:""}</div>`:
    `<button type="button" class="contact-open" style="width:100%;text-align:left;min-height:48px">Ajouter un contact</button>`}
   </div>
  </div>
  <hr><label class="label">TAILLES ET QUANTITÉS</label>
  <div class="all-sizes-box"><label for="all-sizes-${l.id}" class="label">Même quantité pour toutes les tailles</label><div class="row"><input id="all-sizes-${l.id}" class="all-sizes-input" type="number" min="0" max="6" step="1" inputmode="numeric" enterkeyhint="done" placeholder="0–6" aria-label="Quantité de 0 à 6 pour toutes les tailles"><button type="button" class="ok apply-all-sizes">Appliquer</button></div></div>
  <div class="sizes">
   ${SIZES.map(s=>`<div class="size-card"><div class="size-title"><span>Taille ${s}</span><span class="muted">Qté : ${l.quantities[s]}</span></div><div class="choices">${[0,1,2,3,4,5,6].map(q=>`<button class="choice ${l.quantities[s]===q?"active":""}" data-size="${s}" data-q="${q}">${q}</button>`).join("")}</div></div>`).join("")}
  </div>
  <div class="panel"><label class="label">RÉCAPITULATIF</label><div class="muted">TOTAL DES QUANTITÉS</div><div class="total">${total(l)}</div><hr>
   <label class="label">PRIX D'UNE ABAYA</label>
   ${l.priceLocked?`<div class="row" style="justify-content:space-between"><strong>${money(l.price)}</strong><button class="soft edit-price">Modifier</button></div><div class="status"> Prix validé et verrouillé</div>`:
   `<div class="row"><input class="grow price-input" type="number" min="0" step="0.01" inputmode="decimal" enterkeyhint="done" value="${escapeHTML(l.priceDraft)}" placeholder="Entrer le prix"><span>AED</span><button class="ok price-ok">OK</button></div>`}
   <hr><div class="muted">VALEUR TOTALE</div><div class="grand">${money((l.price??0)*total(l))}</div>
   <hr><label class="deposit-line"><input class="deposit-check" type="checkbox" ${l.depositEnabled?"checked":""}> Acompte</label>
   <div class="deposit-amount ${l.depositEnabled?"":"hidden"}"><label class="label" for="deposit-${l.id}">MONTANT DE L’ACOMPTE (AED)</label>
   ${l.depositLocked?`<div class="row" style="justify-content:space-between"><strong>${money(Number(l.depositAmount)||0)}</strong><button type="button" class="soft edit-deposit">Modifier</button></div><div class="status"> Acompte confirmé et verrouillé</div>`:`<div class="row"><input id="deposit-${l.id}" class="deposit-input grow" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="0.01" value="${escapeHTML(l.depositDraft??l.depositAmount)}" placeholder="Montant de l’acompte"><span>AED</span><button type="button" class="ok deposit-ok">OK</button></div>`}
   <p class="muted">L’acompte confirmé est déduit de la valeur totale.</p></div>
   <hr><div class="muted">RESTE À PAYER</div><div class="due">${money(amountDue(l))}</div>${sellerRefund(l)>0?`<div class="seller-refund"><span>MONTANT QUE LE VENDEUR DOIT ME RENDRE</span><strong>${money(sellerRefund(l))}</strong></div>`:""}
  </div>
  <div class="export-actions"><button type="button" class="export-text"> Générer un document texte</button><button type="button" class="export-pdf" style="width:100%;margin-top:9px;background:#176b45;color:white;border:0;font-weight:700;padding:14px;border-radius:12px"> Générer un PDF</button></div>
  <div style="margin-top:14px"><button class="danger reset"> Réinitialiser cette liste</button></div>
 </section>`).join("");
 document.querySelectorAll(".list").forEach(el=>bind(el,Number(el.dataset.id)));
 $("#page-counter").textContent=`${activeIndex+1} / ${visible.length}`;$("#page-counter-top").textContent="Ajouter une nouvelle collection";
 $("#prev-page").disabled=activeIndex===0;
 $("#next-page").disabled=activeIndex===visible.length-1;
}
function bind(el,id){
 const l=lists.find(x=>x.id===id);
 const get=sel=>el.querySelector(sel);
 if(get(".export-text"))get(".export-text").onclick=()=>exportOptions(l,"txt");
 if(get(".export-pdf"))get(".export-pdf").onclick=()=>exportOptions(l,"pdf");
 if(get(".close-page"))get(".close-page").onclick=()=>{
  // Fermer réellement cette page : elle disparaît de la navigation, sans effacer ses données.
  const previousIndex=activeIndex;
  l.closed=true;
  save();
  activeIndex=Math.max(0,previousIndex-1);
  slideDirection="left";
  render();
  window.scrollTo({top:0,behavior:"instant"});
 };
 if(get(".delete-list"))get(".delete-list").onclick=()=>{
  ask("Supprimer cette liste ?","Saisis le mot de passe 1234 pour confirmer la suppression de cette liste uniquement.",(password)=>{
   if(password!=="1234"){alert("Mot de passe incorrect. La liste n’a pas été supprimée.");return}
   const deletedIndex=visibleLists().findIndex(item=>item.id===id);lists=lists.filter(item=>item.id!==id);if(deletedIndex<=activeIndex)activeIndex=Math.max(0,activeIndex-1);slideDirection="left";save();render();
  },'<input id="reset-password" type="password" inputmode="numeric" placeholder="Mot de passe" style="width:100%;padding:12px;border:1px solid #cbd7ce;border-radius:10px">');
 };
 get(".name-input").addEventListener("input",e=>{const v=e.target.value.toUpperCase();e.target.value=v;l.draft=v;save()});
 get(".name-ok").onclick=()=>{const v=l.draft.trim();if(!v)return;if(l.name&&l.name!==v)ask("Confirmer le changement de nom ?",`Remplacer « ${l.name} » par « ${v} » ?`,()=>patch(id,{name:v,locked:true}));else patch(id,{name:v,locked:true})};
 if(get(".edit-name"))get(".edit-name").onclick=()=>ask("Modifier le nom ?","Souhaites-tu modifier le nom de cette abaya ?",()=>patch(id,{locked:false,draft:l.name}));
 if(get(".delete-name"))get(".delete-name").onclick=()=>ask("Supprimer le nom ?","Le nom de cette abaya sera effacé. Les autres informations et la photo seront conservées.",()=>patch(id,{name:"",draft:"",locked:false}));
 if(get(".contact-open"))get(".contact-open").onclick=()=>contactPopup(l);
 if(get(".edit-contact"))get(".edit-contact").onclick=()=>ask("Confirmer la modification","Souhaites-tu modifier les informations de ce contact ?",()=>contactPopup(l));
 if(get(".save-whatsapp"))get(".save-whatsapp").onclick=()=>saveWhatsAppContact(l.contact);
 get(".camera").onclick=()=>get(".camera-input").click();
 get(".gallery").onclick=()=>get(".gallery-input").click();
 const handleFile=e=>{const file=e.target.files?.[0];if(!file)return;if(file.type&&!file.type.startsWith("image/")){alert("Choisis un fichier image.");return}if(file.size>12*1024*1024){alert("Photo trop volumineuse (maximum 12 Mo avant compression).");return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);patch(id,{image:canvas.toDataURL("image/jpeg",.72)})};img.onerror=()=>alert("Impossible de lire cette photo. Essaie une image JPEG ou PNG.");img.src=reader.result};reader.onerror=()=>alert("Impossible de charger cette photo.");reader.readAsDataURL(file)};
 get(".camera-input").onchange=handleFile;get(".gallery-input").onchange=handleFile;
 if(get(".remove-photo"))get(".remove-photo").onclick=()=>ask("Supprimer la photo ?","La miniature sera retirée de cette liste.",()=>patch(id,{image:""}));
 const allSizesInput=get(".all-sizes-input");
 get(".apply-all-sizes").onclick=()=>{
  const raw=allSizesInput.value.trim(),q=Number(raw);
  if(raw===""||!Number.isInteger(q)||q<0||q>6){alert("Entre un nombre entier entre 0 et 6.");return;}
  const quantities=Object.fromEntries(SIZES.map(size=>[size,q]));
  patch(id,{quantities});
 };
 el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const s=b.dataset.size,q=Number(b.dataset.q),old=l.quantities[s];if(q===old)return;ask("Confirmer la quantité ?",`Pour la taille ${s}, remplacer ${old} par ${q} ?`,()=>patch(id,{quantities:{...l.quantities,[s]:q}}))});
 if(get(".price-input")){get(".price-input").oninput=e=>{l.priceDraft=e.target.value;save()};get(".price-ok").onclick=()=>{const v=l.priceDraft.trim(),p=Number(v);if(!v||!Number.isFinite(p)||p<0){alert("Entre un prix valide.");return}if(l.price!==null&&p!==l.price)ask("Confirmer le changement de prix ?",`Remplacer ${money(l.price)} par ${money(p)} ?`,()=>patch(id,{price:p,priceLocked:true}));else patch(id,{price:p,priceLocked:true})}}
 if(get(".edit-price"))get(".edit-price").onclick=()=>patch(id,{priceDraft:String(l.price),priceLocked:false});
 get(".deposit-check").onchange=e=>{
  const enabled=e.target.checked;
  if(l.depositLocked && enabled!==l.depositEnabled){
   ask("Confirmer la modification de l’acompte ?",enabled?"Réactiver l’acompte enregistré ?":"Désactiver l’acompte ? Le reste à payer sera recalculé.",()=>patch(id,{depositEnabled:enabled}));
   e.target.checked=l.depositEnabled;
  }else patch(id,{depositEnabled:enabled});
 };
 if(get(".deposit-input"))get(".deposit-input").oninput=e=>{l.depositDraft=e.target.value;save()};
 if(get(".deposit-ok"))get(".deposit-ok").onclick=()=>{
  const raw=String(l.depositDraft??"").trim().replace(",",".");const value=Number(raw);
  if(raw===""||!Number.isFinite(value)||value<0){alert("Entre un montant d’acompte valide.");return}
  const update=()=>patch(id,{depositAmount:String(value),depositDraft:String(value),depositLocked:true});
  if(l.depositAmount!=="" && Number(l.depositAmount)!==value)ask("Confirmer la modification de l’acompte ?",`Remplacer ${money(Number(l.depositAmount)||0)} par ${money(value)} ?`,update);
  else update();
 };
 if(get(".edit-deposit"))get(".edit-deposit").onclick=()=>patch(id,{depositDraft:l.depositAmount,depositLocked:false});
 get(".reset").onclick=()=>{modalAction=(val)=>{if(val==="1234"){const idx=lists.findIndex(x=>x.id===id);if(idx>=0)lists[idx]=fresh(id);save();render()}else{alert("Mot de passe incorrect.");}};$("#modal-title").textContent="Réinitialiser cette liste";$("#modal-text").textContent="Entre le mot de passe pour effacer uniquement cette liste.";$("#modal-extra").innerHTML='<input id="reset-password" type="password" inputmode="numeric" placeholder="Mot de passe" style="width:100%;padding:12px;border:1px solid #cbd7ce;border-radius:10px">';$("#modal").classList.remove("hidden")};
}
function goPage(delta){const next=activeIndex+delta;if(next<0||next>=visibleLists().length)return;activeIndex=next;slideDirection=delta>0?"right":"left";render();window.scrollTo({top:0,behavior:"instant"})}

$("#prev-page").onclick=()=>goPage(-1);
$("#next-page").onclick=()=>goPage(1);


let touchStart=null;
$("#lists").addEventListener("touchstart",e=>{if(e.touches.length!==1||e.target.closest("input,textarea,select,button,a"))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$("#lists").addEventListener("touchend",e=>{if(!touchStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)goPage(dx<0?1:-1)},{passive:true});
// La touche Terminé/OK du clavier Android valide les champs numériques.
document.addEventListener("keydown",event=>{
 if(event.key!=="Enter"||!event.target.matches('input[enterkeyhint="done"]'))return;
 event.preventDefault();
 const input=event.target;
 if(input.classList.contains("price-input")){input.closest(".row")?.querySelector(".price-ok")?.click();}
 else if(input.classList.contains("deposit-input")){input.closest(".row")?.querySelector(".deposit-ok")?.click();}
 else if(input.classList.contains("all-sizes-input")){input.closest(".row")?.querySelector(".apply-all-sizes")?.click();}
 else input.blur();
});

// Sauvegarder puis quitter l'application entière, et non la fiche Abaya.
$("#quit-app").onclick=()=>{
 const active=document.querySelector(".list.active-page .reset");
 if(active)active.click();
};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&pendingSave)flushSave()});
window.addEventListener("pagehide",()=>{if(pendingSave){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(lists))}catch(e){}}});
document.getElementById("retry-sync").onclick=()=>{lastSaveError=false;document.getElementById("retry-sync").hidden=true;flushSave()};

$("#add").onclick=()=>{const page=fresh(nextId++);lists.unshift(page);save();render(page.id);window.scrollTo({top:0,behavior:"instant"})};
loadRemote().catch(e=>statusText(" Chargement impossible : "+e.message));
</script>



</body></html>
